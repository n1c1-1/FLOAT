# H-O: the H-alpha and O III filters (two filters of a monochrome camera, or a dual-band image's channels read by the
# wires: H-alpha from its red, O III from its green and blue) combined into one colour image.
# Every setting is explained in _example.toml; the methods and their sources in stages/combine.py.
#
# Version 2: the composition of the narrow-band filters as it is established. The O III is equalised to the H-alpha
# while linear, then the filters are composed as they are: H-alpha in red, O III in green and blue. Version 1 fitted
# the O III to the H-alpha by a linear match, took the lightness from the filters weighted by their noise and raised
# the colour's strength to 1.9: on a monochrome camera's filters the nebula came out a flat saturated red, its O III
# gone (the green at 0 over most of its interior).

id = "ho"
name = "H-O"
version = 2
description = "Combines the H-alpha and O III filters (two filters, or a dual-band image's channels) into one colour image: the O III equalised to the H-alpha, then each filter a hue (H-alpha red, O III green and blue)."
narrowband = true

[[inputs]]
role = "Ha"
label = "Hα"
type = "any"
channel = "L"

[[inputs]]
role = "OIII"
label = "O III"
type = "any"
channel = "L"

# the dual-band filter's usual mapping: H-alpha red, O III cyan (green and blue)
[parameters.hue_ha]
default = 0.0
min = 0
max = 360
label = "Hα hue"
help = "The colour of the H-alpha filter (0 red, 120 green, 240 blue)."

[parameters.hue_oiii]
default = 180.0
min = 0
max = 360
label = "O III hue"
help = "The colour of the O III filter (180: green and blue)."

# Rector, Levay, Frattare, English & Pu'uohau-Pummill 2007 (AJ 133, 598): each filter's background set to 0 first.
[[steps]]
op = "neutralise_sky"

# The O III brought to the H-alpha's median and median absolute deviation (the formula of Siril's H-alpha and O III
# extraction script and of its RGB composition tutorial): the strongest signal is the reference (siril.org/faq:
# "pick the Ha stack as reference").
[[steps]]
op = "equalise"
reference = "Ha"

# The plain composition: red = H-alpha, green = blue = O III (the hues 0 and 180 are that matrix), no normalisation
# by the composition itself; the sky is at 0 in the three colours.
[output]
channels = ["Ha", "OIII"]
hues = ["$hue_ha", "$hue_oiii"]
