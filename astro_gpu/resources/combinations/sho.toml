# S-H-O: the S II, H-alpha and O III filters of a monochrome camera combined into one colour image.
# Every setting is explained in _example.toml; the methods and their sources in stages/combine.py.
#
# Version 2: the composition of the narrow-band filters as it is established. The S II and the O III are equalised to
# the H-alpha while linear, then each filter is given its hue and the layers are added as they are. Version 1 fitted
# them to the H-alpha by a linear match (a weak S II multiplied by 14 on a small nebula: its sky's residue painted the
# field orange), took the lightness from the filters weighted by their noise and raised the colour's strength to 1.9.

id = "sho"
name = "S-H-O"
version = 2
description = "Combines the S II, H-alpha and O III filters into one colour image: the S II and the O III equalised to the H-alpha, then each filter a hue."
# a palette of narrow-band filters: each line is its own channel (Post's H-alpha slider is off)
narrowband = true

[[inputs]]
role = "SII"
label = "S II"
type = "any"
channel = "L"

[[inputs]]
role = "Ha"
label = "Hα"
type = "any"
channel = "L"

[[inputs]]
role = "OIII"
label = "O III"
type = "any"
channel = "L"

# The hues are measured on five public S-H-O composites of the Hubble teams (ESA/Hubble heic1501a, opo9544a,
# heic1007a, heic1520a, heic0707a), in Oklch (B. Ottosson 2020): S II on the warm areas' lower quartile (Oklch 36.0),
# H-alpha on their median (57.1), O III on the blue areas' median (244.7); here as hues of the HSV wheel.
[parameters.hue_sii]
default = 15.5
min = 0
max = 360
label = "S II hue"
help = "The colour of the S II filter (on the colour wheel: 0 red, 120 green, 240 blue)."

[parameters.hue_ha]
default = 31.4
min = 0
max = 360
label = "Hα hue"
help = "The colour of the H-alpha filter (0 red, 120 green, 240 blue)."

[parameters.hue_oiii]
default = 202.2
min = 0
max = 360
label = "O III hue"
help = "The colour of the O III filter (0 red, 120 green, 240 blue)."

# Rector, Levay, Frattare, English & Pu'uohau-Pummill 2007 (AJ 133, 598): each filter's background set to 0 first.
[[steps]]
op = "neutralise_sky"

# Every filter brought to the H-alpha's median and median absolute deviation (the formula of Siril's H-alpha and
# O III extraction script and of its RGB composition tutorial); the H-alpha, the strongest signal, is the reference
# (siril.org/faq: "pick the Ha stack as reference").
[[steps]]
op = "equalise"
reference = "Ha"

[output]
channels = ["SII", "Ha", "OIII"]
# Rector et al. 2007: each filter given a hue, the layers added, balanced so that equal filters give a grey; mixed
# as they are (no lightness of our own, no colour strength)
hues = ["$hue_sii", "$hue_ha", "$hue_oiii"]
